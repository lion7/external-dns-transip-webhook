on:
  release:
    types:
      - 'created'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.8
      - run: go test ./...
      - run: ko build --bare -t ${{ github.ref_name }} --platform linux/amd64,linux/arm64 .
